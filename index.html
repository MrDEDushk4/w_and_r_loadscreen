<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <!-- Подключение аккуратного шрифта Montserrat для слогана -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121214;
        }

        /* 1. Плывущий градиентный фон */
        .flowing-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                125deg,
                #481417 0%,
                #8a3138 16%,
                #b8474f 28%,
                #722429 42%,
                #18181b 58%,
                #291e20 68%,
                #8a2f35 84%,
                #4e171b 100%
            );
            background-size: 260% 260%;
            animation: flowMotion 11s ease-in-out infinite alternate;
        }

        /* 2. Слой мягкого светового перелива */
        .silk-overlay {
            position: absolute;
            inset: -25%;
            background: 
                radial-gradient(ellipse at 25% 35%, rgba(205, 75, 85, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 65%, rgba(15, 15, 18, 0.75) 0%, transparent 60%);
            filter: blur(35px);
            animation: waveMotion 14s ease-in-out infinite alternate;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* 3. Холст для анимированных волн */
        #waveCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 4. Единый центр: Текст + Череп + W&R */
        .brand-center {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: brandFloat 7s ease-in-out infinite alternate;
        }

        /* --- ВЕРХНИЙ ТЕКСТ: WELCOME TO --- */
        .welcome-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(30px, 3.8vw, 48px);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -18px;
            z-index: 8;
            user-select: none;
        }

        .c-welco { color: rgba(255, 255, 255, 0.25); }
        .c-me    { color: rgba(222, 33, 33, 0.25); }
        .c-to    { color: rgba(130, 26, 26, 0.25); }

        /* --- ЧЕРЕП --- */
        .skull-img {
            height: 54vh;
            max-height: 520px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95))
                    drop-shadow(15px 5px 35px rgba(0, 0, 0, 0.85));
        }

        /* --- НИЖНИЙ ТЕКСТ: W&R --- */
        .wr-logo {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(80px, 9.5vw, 130px);
            line-height: 0.8;
            margin-top: -85px;
            z-index: 9;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.9));
        }

        .c-w { color: #FFFFFF; }
        .c-amp {
            background: linear-gradient(180deg, #B5B5B5 0%, #720A0C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .c-r { color: #A61717; }

        /* 5. Слоган в нижней части экрана */
        .bottom-slogan {
            position: absolute;
            bottom: clamp(24px, 3.8vh, 38px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: clamp(13px, 1.25vw, 19px);
            font-weight: 400;
            color: #FFFFFF;
            /* Широкая расстановка букв как на скриншоте */
            letter-spacing: clamp(6px, 0.55vw, 11px);
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.8);
        }

        /* 6. Тёмная рамка по краям экрана */
        .screen-frame {
            position: absolute;
            inset: 0;
            border: 14px solid #16171a;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes flowMotion {
            0% { background-position: 0% 15%; }
            50% { background-position: 100% 85%; }
            100% { background-position: 15% 100%; }
        }

        @keyframes waveMotion {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-4%, 3%) scale(1.04); }
            100% { transform: translate(3%, -3%) scale(0.98); }
        }

        @keyframes brandFloat {
            0% { transform: translate(-50%, -50%) translateY(0px) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-10px) scale(1.015); }
        }
    </style>
</head>
<body>

    <!-- Плывущий градиент -->
    <div class="flowing-gradient"></div>
    <div class="silk-overlay"></div>

    <!-- Анимированные волны -->
    <canvas id="waveCanvas"></canvas>

    <!-- Центр: Текст + Череп + W&R -->
    <div class="brand-center">
        <div class="welcome-title">
            <span class="c-welco">WELCO</span><span class="c-me">ME</span> <span class="c-to">TO</span>
        </div>

        <img src="Skull1.png" alt="Skull" class="skull-img">

        <div class="wr-logo">
            <span class="c-w">W</span><span class="c-amp">&amp;</span><span class="c-r">R</span>
        </div>
    </div>

    <!-- Нижняя надпись (слоган) -->
    <div class="bottom-slogan">
        Без лишнего хлама. Без имбалансного говна.
    </div>

    <!-- Внешняя рамка -->
    <div class="screen-frame"></div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const lineCount = 6;
        let time = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            const slope = (h * 1.05) / w;
            const baseSpacing = (h + w * slope) / (lineCount - 0.4);
            const paths = [];

            for (let i = 0; i < lineCount; i++) {
                const points = [];
                const baseY = i * baseSpacing - (w * slope * 0.12);
                const phase = i * 0.85;

                for (let x = -50; x <= w + 50; x += 6) {
                    const normX = x / w;

                    const wave1 = Math.sin(normX * Math.PI * 2.2 + time * 0.75 + phase) * (h * 0.055);
                    const wave2 = Math.cos(normX * Math.PI * 1.4 - time * 0.5 + phase * 1.2) * (h * 0.035);
                    const breathe = Math.sin(time * 0.4 + phase) * (h * 0.02);

                    const y = baseY - (x * slope) + wave1 + wave2 + breathe;
                    points.push({ x, y });
                }

                paths.push(points);
            }

            // Тень волн
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 6;
            ctx.lineWidth = 8.5;
            ctx.strokeStyle = 'rgba(15, 15, 18, 0.85)';

            for (let i = 0; i < paths.length; i++) {
                const pts = paths[i];
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let j = 1; j < pts.length; j++) {
                    ctx.lineTo(pts[j].x, pts[j].y);
                }
                ctx.stroke();
            }

            // Контурные серые линии
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.lineWidth = 7.5;
            ctx.strokeStyle = '#6c7278';

            for (let i = 0; i < paths.length; i++) {
                const pts = paths[i];
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let j = 1; j < pts.length; j++) {
                    ctx.lineTo(pts[j].x, pts[j].y);
                }
                ctx.stroke();
            }

            time += 0.012;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
