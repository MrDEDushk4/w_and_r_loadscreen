<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121214;
        }

        /* 1. Градиент: статичный, увеличенный в 2.5 раза. Двигаем через transform
              (не перерисовывается, в отличие от background-position) */
        .flowing-gradient {
            position: absolute;
            top: 0; left: 0;
            width: 250%;
            height: 250%;
            background: linear-gradient(
                125deg,
                #481417 0%,
                #8a3138 16%,
                #b8474f 28%,
                #722429 42%,
                #18181b 58%,
                #291e20 68%,
                #8a2f35 84%,
                #4e171b 100%
            );
            will-change: transform;
            animation: flowMotion 14s ease-in-out infinite alternate;
        }

        /* 2. Световой перелив: без blur() и mix-blend-mode (самые дорогие эффекты).
              Радиальные градиенты и так мягкие */
        .silk-overlay {
            position: absolute;
            inset: -25%;
            background:
                radial-gradient(ellipse at 25% 35%, rgba(205, 75, 85, 0.30) 0%, transparent 60%),
                radial-gradient(ellipse at 75% 65%, rgba(15, 15, 18, 0.70) 0%, transparent 65%);
            pointer-events: none;
            will-change: transform;
            animation: waveMotion 16s ease-in-out infinite alternate;
        }

        /* 3. Волны: канвас рисуется в уменьшенном разрешении, растягивается CSS */
        #waveCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 4. Центр */
        .brand-center {
            position: absolute;
            top: 48%;
            left: 50%;
            z-index: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transform: translate(-50%, -50%);
            will-change: transform;
            animation: brandFloat 7s ease-in-out infinite alternate;
        }

        .welcome-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(30px, 3.8vw, 48px);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -18px;
            z-index: 8;
            user-select: none;
        }

        .c-welco { color: rgba(255, 255, 255, 0.25); }
        .c-me    { color: rgba(222, 33, 33, 0.25); }
        .c-to    { color: rgba(130, 26, 26, 0.25); }

        /* Череп: один drop-shadow вместо двух. Анимируется только родитель (transform),
           так что фильтр растеризуется один раз */
        .skull-img {
            height: 54vh;
            max-height: 520px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(8px 12px 28px rgba(0, 0, 0, 0.9));
        }

        .wr-logo {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(80px, 9.5vw, 130px);
            line-height: 0.8;
            margin-top: -85px;
            z-index: 9;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            /* text-shadow дешевле, чем filter: drop-shadow */
            text-shadow: 0 6px 15px rgba(0, 0, 0, 0.9);
        }

        .c-w { color: #FFFFFF; }
        .c-amp {
            background: linear-gradient(180deg, #B5B5B5 0%, #720A0C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            /* text-shadow на прозрачном тексте даст артефакт */
            text-shadow: none;
        }
        .c-r { color: #A61717; }

        .bottom-slogan {
            position: absolute;
            bottom: clamp(24px, 3.8vh, 38px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: clamp(13px, 1.25vw, 19px);
            font-weight: 400;
            color: #FFFFFF;
            letter-spacing: clamp(6px, 0.55vw, 11px);
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .screen-frame {
            position: absolute;
            inset: 0;
            border: 14px solid #16171a;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 10;
        }

        /* Все анимации только на transform */
        @keyframes flowMotion {
            0%   { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-55%, -50%, 0); }
        }

        @keyframes waveMotion {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(-4%, 3%, 0) scale(1.04); }
            100% { transform: translate3d(3%, -3%, 0) scale(0.98); }
        }

        @keyframes brandFloat {
            0%   { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="flowing-gradient"></div>
    <div class="silk-overlay"></div>

    <canvas id="waveCanvas"></canvas>

    <div class="brand-center">
        <div class="welcome-title">
            <span class="c-welco">WELCO</span><span class="c-me">ME</span> <span class="c-to">TO</span>
        </div>

        <img src="Skull1.png" alt="Skull" class="skull-img">

        <div class="wr-logo">
            <span class="c-w">W</span><span class="c-amp">&amp;</span><span class="c-r">R</span>
        </div>
    </div>

    <div class="bottom-slogan">
        Без лишнего хлама. Без дизбалансного говна.
    </div>

    <div class="screen-frame"></div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // ---- Настройки производительности ----
        const RENDER_SCALE = 0.6;   // разрешение канваса относительно экрана (0.5-1)
        const TARGET_FPS   = 30;    // волны медленные, 30 кадров достаточно
        const X_STEP       = 20;    // шаг точек по X (было 6)
        const LINE_COUNT   = 6;

        const FRAME_MS = 1000 / TARGET_FPS;
        let w = 0, h = 0;

        function resize() {
            w = Math.max(1, Math.round(window.innerWidth  * RENDER_SCALE));
            h = Math.max(1, Math.round(window.innerHeight * RENDER_SCALE));
            canvas.width = w;
            canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        let last = 0;

        function buildPath() {
            const slope = (h * 1.05) / w;
            const baseSpacing = (h + w * slope) / (LINE_COUNT - 0.4);
            const step = X_STEP * RENDER_SCALE;

            // Все 6 линий в ОДНОМ path -> один вызов stroke() вместо шести
            ctx.beginPath();
            for (let i = 0; i < LINE_COUNT; i++) {
                const baseY = i * baseSpacing - (w * slope * 0.12);
                const phase = i * 0.85;
                const breathe = Math.sin(time * 0.4 + phase) * (h * 0.02);

                let first = true;
                for (let x = -50; x <= w + 50; x += step) {
                    const normX = x / w;
                    const y = baseY - (x * slope)
                        + Math.sin(normX * Math.PI * 2.2 + time * 0.75 + phase) * (h * 0.055)
                        + Math.cos(normX * Math.PI * 1.4 - time * 0.5 + phase * 1.2) * (h * 0.035)
                        + breathe;
                    if (first) { ctx.moveTo(x, y); first = false; }
                    else ctx.lineTo(x, y);
                }
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);

            const delta = now - last;
            if (delta < FRAME_MS) return;
            last = now - (delta % FRAME_MS);

            // Скорость анимации не зависит от fps
            time += 0.012 * (delta / 16.667);

            ctx.clearRect(0, 0, w, h);
            ctx.lineJoin = 'round';

            // Тень: shadowBlur ОЧЕНЬ дорогой на каждом кадре, поэтому
            // имитируем тень более широкой тёмной линией со смещением
            ctx.save();
            ctx.translate(1 * RENDER_SCALE, 6 * RENDER_SCALE);
            buildPath();
            ctx.lineWidth = 12 * RENDER_SCALE;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.stroke();
            ctx.restore();

            // Тёмная подложка линии
            buildPath();
            ctx.lineWidth = 8.5 * RENDER_SCALE;
            ctx.strokeStyle = 'rgba(15, 15, 18, 0.85)';
            ctx.stroke();

            // Серая линия сверху (тот же path)
            ctx.lineWidth = 7.5 * RENDER_SCALE;
            ctx.strokeStyle = '#6c7278';
            ctx.stroke();
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
